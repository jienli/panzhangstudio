<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Framing Styles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f5f0e6; --ink: #1f1c19; --soft: #5d554b; --faint: #8c8376; --line: #d8cebd; --seal: #b03a2a;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 19px/1.6 "Cormorant Garamond", "Noto Serif SC", Georgia, serif;
}
header { padding: 28px clamp(16px, 5vw, 64px) 8px; max-width: 1400px; margin: 0 auto; }
h1 { margin: 0; font-weight: 400; font-size: 34px; }
.lead { margin: 4px 0 20px; color: var(--soft); max-width: 46em; }
.controls { display: flex; flex-wrap: wrap; gap: 4px; align-items: baseline; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.controls .label { color: var(--faint); font-size: 15px; margin-right: 6px; }
.controls button {
  font: inherit; font-size: 17px; background: none; border: 0; cursor: pointer; color: var(--soft);
  padding: 2px 10px; border-bottom: 1px solid transparent;
}
.controls button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--seal); }
.note { color: var(--faint); font-size: 16px; font-style: italic; margin: 14px 0 0; }

main { max-width: 1400px; margin: 0 auto; padding: 48px clamp(16px, 5vw, 64px) 96px; }
.gallery { columns: 3 300px; column-gap: clamp(40px, 4.5vw, 72px); }
.card { break-inside: avoid; margin: 0 0 clamp(52px, 6vw, 84px); container-type: inline-size; }
.card figcaption { margin-top: 16px; color: var(--faint); font-size: 16px; }
img { display: block; width: 100%; height: auto; }

/* =============== Mat + walnut frame =============== */
.framed {
  --f: clamp(10px, 3.4cqw, 22px);              /* frame moulding width */
  position: relative; padding: var(--f);
  box-shadow: 0 2px 3px rgba(30,18,10,.28), 0 20px 36px -16px rgba(30,18,10,.55);
}
.framed .side { position: absolute; overflow: hidden; }
.framed .side::after { content: ""; position: absolute; inset: 0; }
.framed .top, .framed .bottom { left: 0; right: 0; height: var(--f);
  background: url(../site/textures/walnut-h.jpg) var(--ox) var(--oy) / 1024px 128px; }
.framed .left, .framed .right { top: 0; bottom: 0; width: var(--f);
  background: url(../site/textures/walnut-v.jpg) var(--oy) var(--ox) / 128px 1024px; }
/* mitred corners: each length of moulding is a trapezoid, so the grain turns at 45° */
.framed .top    { top: 0;    clip-path: polygon(0 0, 100% 0, calc(100% - var(--f)) 100%, var(--f) 100%); }
.framed .bottom { bottom: 0; clip-path: polygon(var(--f) 0, calc(100% - var(--f)) 0, 100% 100%, 0 100%); }
.framed .left   { left: 0;   clip-path: polygon(0 0, 100% var(--f), 100% calc(100% - var(--f)), 0 100%); }
.framed .right  { right: 0;  clip-path: polygon(0 var(--f), 100% 0, 100% 100%, 0 calc(100% - var(--f))); }
/* moulding profile, outer edge -> inner lip; light comes from above */
.framed .side::after {
  --profile: rgba(0,0,0,.55) 0, rgba(0,0,0,.12) 9%, rgba(255,240,220,.16) 22%, rgba(255,240,220,.05) 38%,
             rgba(0,0,0,0) 55%, rgba(0,0,0,.22) 78%, rgba(0,0,0,.05) 84%, rgba(255,225,185,.42) 89%,
             rgba(255,225,185,.15) 93%, rgba(0,0,0,.45) 100%;
}
.framed .top::after    { background: linear-gradient(to bottom, var(--profile)), rgba(255,245,230,.06); }
.framed .bottom::after { background: linear-gradient(to top,    var(--profile)), rgba(0,0,0,.20); }
.framed .left::after   { background: linear-gradient(to right,  var(--profile)), rgba(255,245,230,.02); }
.framed .right::after  { background: linear-gradient(to left,   var(--profile)), rgba(0,0,0,.12); }

.framed .mat {
  position: relative; padding: clamp(18px, 8.5cqw, 52px);
  background: url(../site/textures/mat.jpg) 0 0 / 256px 256px;
}
/* shadow the moulding casts onto the mat */
.framed .mat::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  box-shadow: inset 0 3px 5px -1px rgba(0,0,0,.38), inset 2px 0 4px -1px rgba(0,0,0,.2),
              inset -1px 0 3px -1px rgba(0,0,0,.12), inset 0 -1px 2px -1px rgba(0,0,0,.08);
}
/* the bevelled window cut: white core, each face lit differently */
.framed .bevel {
  border: clamp(2px, .6cqw, 4px) solid;
  border-color: #e0d9ca #f0ebe1 #fdfbf6 #e9e3d6;
}
.framed .bevel img { box-shadow: 0 0 0 1px rgba(60,45,30,.10); }

/* =============== Hanging scroll 立轴 =============== */
.scroll { position: relative; padding-top: 11cqw; margin: 0 6cqw; }
.scroll .mount {
  position: relative;
  background: url(textures/silk.jpg) var(--ox) var(--oy) / 192px 192px;
  box-shadow: 0 1px 2px rgba(60,45,30,.16), 6px 20px 30px -22px rgba(40,28,18,.55);
}
/* fabric hanging catches the light slightly unevenly */
.scroll .mount::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(100deg, rgba(255,255,255,.05), transparent 35%, rgba(0,0,0,.025) 70%, rgba(255,255,255,.03));
}
.scroll .tian { height: 21cqw; position: relative; }   /* 天头: top border */
.scroll .di   { height: 10cqw; }                         /* 地头: bottom border */
.scroll .gs {                                            /* 隔水: contrasting bands */
  height: 4.2cqw; background: url(textures/silk-band.jpg) var(--oy) var(--ox) / 192px 192px;
  box-shadow: inset 0 1px 0 rgba(120,100,70,.35), inset 0 -1px 0 rgba(120,100,70,.35);
}
.scroll .gs.low { height: 2.8cqw; }
.scroll .mid { padding: 2.4cqw 6.5cqw; }
.scroll .trim { padding: max(1px, .35cqw); background: #b9a888; box-shadow: 0 0 0 1px rgba(255,255,255,.35); }
/* 惊燕: two strips hanging from the top stick */
.scroll .swallows { position: absolute; top: 0; left: 37%; right: 37%; height: 15cqw; display: flex; justify-content: space-between; }
.scroll .swallows span {
  width: 6.5%; min-width: 3px;
  background: url(textures/silk-band.jpg) 0 0 / 96px 96px;
  box-shadow: 1px 1px 2px rgba(60,45,30,.22), inset 0 -1px 0 rgba(120,100,70,.3);
}
/* 天杆: flat top stick */
.scroll .stick {
  position: absolute; left: 0; right: 0; top: 11cqw; height: clamp(6px, 1.9cqw, 11px); z-index: 2;
  background:
    linear-gradient(to bottom, rgba(255,235,210,.25), rgba(255,235,210,.05) 35%, rgba(0,0,0,.15) 70%, rgba(0,0,0,.55)),
    url(../site/textures/walnut-h.jpg) var(--ox) 0 / 1024px 128px;
  border-radius: 1px; box-shadow: 0 2px 3px -1px rgba(30,18,10,.4);
}
/* hanging cord */
.scroll svg.cord { position: absolute; left: 0; top: 0; width: 100%; height: 11.5cqw; overflow: visible; }
/* 地轴: round roller with end knobs 轴头 */
.scroll .roller {
  --r: clamp(10px, 3.4cqw, 19px);
  position: absolute; left: 0; right: 0; bottom: calc(var(--r) * -0.55); height: var(--r); z-index: 2;
  background:
    linear-gradient(to bottom, rgba(0,0,0,.55), rgba(255,235,210,.28) 26%, rgba(255,235,210,.08) 42%, rgba(0,0,0,.25) 78%, rgba(0,0,0,.65)),
    url(../site/textures/walnut-h.jpg) var(--ox) 40px / 1024px 128px;
  box-shadow: 0 6px 8px -3px rgba(30,18,10,.45);
}
.scroll .knob {
  position: absolute; top: -16%; bottom: -16%; width: 6cqw; min-width: 10px;
  border-radius: 28% / 42%;
  background:
    radial-gradient(ellipse 60% 40% at 50% 28%, rgba(255,235,210,.35), transparent 70%),
    linear-gradient(to bottom, rgba(0,0,0,.45), transparent 30%, transparent 65%, rgba(0,0,0,.6)),
    url(../site/textures/walnut-v.jpg) 0 0 / 64px 512px;
  box-shadow: 0 5px 7px -3px rgba(30,18,10,.5);
}
.scroll .knob::after { content: ""; position: absolute; top: 12%; bottom: 12%; width: 2px; background: rgba(0,0,0,.35); box-shadow: 1px 0 0 rgba(255,235,210,.18); }
.scroll .knob.l { right: 100%; } .scroll .knob.l::after { right: 18%; }
.scroll .knob.r { left: 100%; }  .scroll .knob.r::after { left: 18%; }
/* wide pieces: horizontal mount 横披, no rollers */
.scroll.wide { padding-top: 0; margin: 0; }
.scroll.wide .tian, .scroll.wide .di { height: 6cqw; }
.scroll.wide .stick, .scroll.wide .roller, .scroll.wide .swallows, .scroll.wide svg.cord { display: none; }

@media (max-width: 560px) { .gallery { columns: 1; } }
</style>
</head>
<body>
<header>
  <h1>Framing styles</h1>
  <p class="lead">Design reference, not part of the website. The site uses the walnut frame; the hanging scroll in rice-beige silk is kept here for later. Textures are generated, the frames are drawn by the page, and the painting images stay untouched.</p>
  <div class="controls" id="styles">
    <span class="label">Style</span>
    <button data-style="frame">Mat + frame</button>
    <button data-style="scroll">Scroll 立轴</button>
  </div>
  <p class="note" id="note"></p>
</header>
<main><div class="gallery" id="g"></div></main>
<script>
const WORKS = [
  { id: "luoshen-peony", w: 636, h: 900 },
  { id: "crimson-peony", w: 900, h: 632 },
  { id: "bamboo-branch-song", w: 657, h: 900 },
  { id: "spring-everywhere", w: 900, h: 666 },
  { id: "red-plum", w: 714, h: 900 },
  { id: "winter-plum", w: 454, h: 900 },
  { id: "a-branch-of-spring", w: 677, h: 900 },
  { id: "peerless-beauty-1", w: 449, h: 900 },
  { id: "peerless-beauty-2", w: 536, h: 900 },
  { id: "flowers-in-season-1", w: 432, h: 900 },
  { id: "flowers-in-season-2", w: 453, h: 900 },
  { id: "peony-2024", w: 247, h: 314 },
  { id: "peony-full-bloom", w: 900, h: 898 },
  { id: "spring-abundance", w: 900, h: 899 },
  { id: "trees-on-rock", w: 590, h: 900 },
];
const NOTES = {
  frame: "Every painting in a walnut frame with a cream mat.",
  scroll: "Every painting as a hanging scroll; wide pieces get a horizontal mount.",
};
const img = (w) => `<img src="../site/images/${w.id}-sm.jpg" width="${w.w}" height="${w.h}" alt="">`;
// Each frame and scroll is cut from a different part of the texture, like real lumber and cloth.
const offsets = (i) => `--ox:${-((i * 377) % 1024)}px;--oy:${-((i * 53) % 128)}px`;

const frameHTML = (w, i) => `<div class="framed" style="${offsets(i)}">
  <div class="side top"></div><div class="side bottom"></div><div class="side left"></div><div class="side right"></div>
  <div class="mat"><div class="bevel">${img(w)}</div></div></div>`;

const scrollHTML = (w, i) => `<div class="scroll${w.w > w.h ? " wide" : ""}" style="${offsets(i)}">
  <svg class="cord" viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="18,10 50,0.6 82,10" fill="none" stroke="#6f5638" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
  </svg>
  <div class="stick"></div>
  <div class="mount">
    <div class="tian"><div class="swallows"><span></span><span></span></div></div>
    <div class="gs"></div>
    <div class="mid"><div class="trim">${img(w)}</div></div>
    <div class="gs low"></div>
    <div class="di"></div>
  </div>
  <div class="roller"><span class="knob l"></span><span class="knob r"></span></div></div>`;

const g = document.getElementById("g");
function render(style) {
  g.innerHTML = "";
  WORKS.forEach((w, i) => {
    const asScroll = style === "scroll";
    const f = document.createElement("figure");
    f.className = "card";
    f.innerHTML = (asScroll ? scrollHTML(w, i) : frameHTML(w, i)) + `<figcaption>${w.id}</figcaption>`;
    g.appendChild(f);
  });
  document.querySelectorAll("#styles button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.style === style)));
  document.getElementById("note").textContent = NOTES[style];
}
document.querySelectorAll("#styles button").forEach(b => b.onclick = () => render(b.dataset.style));
render("frame");
</script>
</body>
</html>
